<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰燼の契約 | ASHBOUND</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="characters.css"><link rel="stylesheet" href="display.css"><link rel="stylesheet" href="battle-presentation.css"><link rel="stylesheet" href="destinations.css"><link rel="stylesheet" href="battle-feedback.css"><link rel="stylesheet" href="lucky.css"><link rel="stylesheet" href="battle-responsive.css"><link rel="stylesheet" href="ui-v104.css"><link rel="stylesheet" href="potion-rewards-v105.css"><link rel="stylesheet" href="act6.css"><link rel="stylesheet" href="card-design.css"><body><div id="game-shell"><header><div class="brand">◇ <span>ASHBOUND<small>灰燼の契約</small></span></div><nav id="nav"></nav><div id="wallet"></div></header><main id="app"></main></div><div id="toast" role="status"></div><script src="cloud-save.js"></script><script src="game.js"></script><script src="upgrade.js"></script><script src="concepts.js"></script><script src="balance.js"></script><script src="motion.js"></script><script src="revision.js"></script><script src="world.js"></script><script src="expansion.js"></script><script src="limits.js"></script><script src="regeneration.js"></script><script src="enemies.js"></script><script src="retirement.js"></script><script src="overhaul.js"></script><script src="patch-notes.js"></script><script src="deck-tools.js"></script><script src="economy.js"></script><script src="relics.js"></script><script src="combat-update.js"></script><script src="run-packs.js"></script><script src="boss-audience.js"></script><script src="balance-v48.js"></script><script src="card-types.js"></script><script src="hunter-icons.js"></script><script src="hunter-cards.js"></script><script src="lucky-icons.js"></script><script src="lucky-cards.js"></script><script src="basic-trade.js"></script><script src="act6-cards.js"></script><script src="characters.js"></script><script src="hunter-combat.js"></script><script src="codex.js"></script><script src="exploration.js"></script><script src="display.js"></script><script src="selection-layout.js"></script><script src="content-v68.js"></script><script src="battle-presentation.js"></script><script src="destinations.js"></script><script src="act2.js"></script><script src="battle-feedback.js"></script><script src="lucky.js"></script><script src="lucky-slot.js"></script><script src="lucky-top.js"></script><script src="lucky-reference.js"></script><script src="lucky-auto.js"></script><script src="ui-v104.js"></script><script src="potion-rewards-v105.js"></script><script src="act3.js"></script><script src="save-backup.js"></script><script src="act4.js"></script><script src="act5.js"></script><script src="act6.js"></script><script src="act7.js"></script><script src="balance-settings.js"></script><script src="balance-runtime.js"></script><script src="balance-live.js"></script><script>
(() => {
  const drawCard = card;
  const frameByType = new Map([
    ['攻撃', 'attack'], ['補助', 'support'],
    ['防御', 'defense'], ['特殊', 'special']
  ]);
  card = function (...args) {
    const markup = drawCard.apply(this, args);
    const label = markup.match(/<small class="card-category">([^<]*)<\/small>/)?.[1];
    if (!label) return markup;
    const frame = frameByType.get(label.split('・')[0]) ?? 'neutral';
    return markup
      .replace(/\bdata-card="-?\d+"/, value => value + ' data-card-frame="' + frame + '"')
      .replace('<span class="latent-badge">役</span>', '<span class="latent-badge card-role-badge">役</span>')
      .replace(/(<div class="art">[\s\S]*?<\/div>)(<small class="card-category">[^<]*<\/small>)(<h3>[\s\S]*?<\/h3>)/,
        '<div class="card-illustration">$3$2$1</div>');
  };
  if (!globalThis.ASHBOUND_HEADLESS) {
    let fitting = false;
    function scheduleCardTextFit() {
      if (fitting) return;
      fitting = true;
      requestAnimationFrame(() => {
        fitting = false;
        const range = document.createRange();
        for (const text of document.querySelectorAll('.card[data-card-frame] > p')) {
          text.style.removeProperty('--card-text-fit');
          if (!text.clientHeight) continue;
          range.selectNodeContents(text);
          const style = getComputedStyle(text);
          const bounds = text.getBoundingClientRect();
          const zoom = bounds.height / text.offsetHeight;
          const padding = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
          const available = bounds.height - padding * zoom;
          const fits = () => text.scrollHeight <= text.clientHeight + 1 && range.getBoundingClientRect().height + 3 * zoom <= available;
          if (fits()) continue;
          let lower = 0;
          let upper = 1;
          for (let step = 0; step < 6; step++) {
            const scale = (lower + upper) / 2;
            text.style.setProperty('--card-text-fit', scale);
            if (fits()) lower = scale;
            else upper = scale;
          }
          text.style.setProperty('--card-text-fit', lower * 0.9);
        }
      });
    }
    const observer = new MutationObserver(scheduleCardTextFit);
    observer.observe(document.body, {childList: true, subtree: true});
    observer.observe(document.documentElement, {attributes: true, attributeFilter: ['style']});
    window.addEventListener('resize', scheduleCardTextFit);
    document.fonts?.ready.then(scheduleCardTextFit);
    render();
    scheduleCardTextFit();
  }
})();
</script></body></html>
