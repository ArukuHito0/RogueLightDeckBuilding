ript><script src="hunter-combat.js"></script><script src="codex.js"></script><script src="exploration.js"></script><script src="display.js"></script><script src="selection-layout.js"></script><script src="content-v68.js"></script><script src="battle-presentation.js"></script><script src="destinations.js"></script><script src="act2.js"></script><script src="battle-feedback.js"></script><script src="lucky.js"></script><script src="lucky-slot.js"></script><script src="lucky-top.js"></script><script src="lucky-reference.js"></script><script src="lucky-auto.js"></script><script src="ui-v104.js"></script><script src="potion-rewards-v105.js"></script><script src="act3.js"></script><script src="save-backup.js"></script><script src="act4.js"></script><script src="act5.js"></script><script src="act6.js"></script><script src="act7.js"></script><script src="balance-settings.js"></script><script src="balance-runtime.js"></script><script src="balance-live.js"></script><script>
(() => {
  const drawCard = card;
  const frameByType = new Map([
    ['攻撃', 'attack'], ['補助', 'support'],
    ['防御', 'defense'], ['特殊', 'special']
  ]);
  card = function (...args) {
    const markup = drawCard.apply(this, args);
    const label = markup.match(/<small class="card-category">([^<]*)<\/small>/)?.[1];
    if (!label) return markup;
    const frame = frameByType.get(label.split('・')[0]) ?? 'neutral';
    return markup
      .replace(/\bdata-card="\d+"/, value => value + ' data-card-frame="' + frame + '"')
      .replace('<span class="latent-badge">役</span>', '<span class="latent-badge card-role-badge">役</span>')
      .replace(/(<div class="art">[\s\S]*?<\/small>)(<h3>[\s\S]*?<\/h3>)/, '$2$1');
  };
  if (!globalThis.ASHBOUND_HEADLESS) render();
})();
</script></body></html>
